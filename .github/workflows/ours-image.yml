name: Ours Image

# Fork-local image build for our deployment.
# Branch `ours` = upstream release + our minimal patch series.
# Pushes ghcr.io/${{ github.repository_owner }}/deeptutor:ours (+ short sha).

on:
  push:
    branches: [ours]
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deeptutor:ours
            ghcr.io/${{ github.repository_owner }}/deeptutor:ours-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
